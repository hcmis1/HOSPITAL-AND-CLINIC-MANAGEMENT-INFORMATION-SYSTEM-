<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — HCMIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <div class="sidebar">
    <div class="brand">HCMIS</div>
    <div class="facility-name" id="facilityName">Loading…</div>

    <div class="nav-group">
      <div class="nav-label">Overview</div>
      <a class="nav-link active" href="dashboard.html">Dashboard</a>
    </div>

    <div class="nav-group">
      <div class="nav-label">Patient Services</div>
      <a class="nav-link" href="patients.html">Patients</a>
      <a class="nav-link" href="appointments.html">Appointments</a>
    </div>

    <div class="nav-group">
      <div class="nav-label">Diagnostics</div>
      <a class="nav-link" href="lab.html">Laboratory</a>
      <a class="nav-link" href="radiology.html">Radiology</a>
    </div>

    <div class="nav-group" id="adminNavGroup" style="display:none;">
      <div class="nav-label">Administration</div>
      <a class="nav-link" href="admin.html">Facilities &amp; Departments</a>
      <a class="nav-link" href="admin.html#users">Users</a>
      <a class="nav-link" href="admin.html#audit">Audit Logs</a>
    </div>

    <div class="sidebar-footer">
      <div class="who" id="whoName">—</div>
      <div class="role" id="whoRole">—</div>
      <button class="link-btn" style="color:#DCEEEA;" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <h1 id="greeting">Welcome</h1>
      <div class="date" id="todayDate"></div>
    </div>

    <div class="stat-grid" id="adminStats" style="display:none;">
      <div class="stat-card"><div class="label">Facilities</div><div class="value" id="statFacilities">–</div></div>
      <div class="stat-card"><div class="label">Departments</div><div class="value" id="statDepartments">–</div></div>
      <div class="stat-card"><div class="label">Active users</div><div class="value" id="statUsers">–</div></div>
    </div>

    <div class="panel">
      <div class="panel-header"><h3>Your workspace</h3></div>
      <div class="panel-body">
        <p id="workspaceMsg" class="empty">Loading your workspace…</p>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
